[project]
name = "pix2pixhd-wind"
version = "0.1.0"
description = "pix2pixHD adapted for Wind Comfort Modeling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=1.4.0",
    "torchvision>=0.5.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "dominate>=2.4.0",
    "Pillow>=8.0.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "tensorboard",
]
