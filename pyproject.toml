[project]
name = "pix2pixhd-wind"
version = "0.1.0"
description = "pix2pixHD adapted for Wind Comfort Modeling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=1.4.0",
    "torchvision>=0.5.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "dominate>=2.4.0",
    "Pillow>=8.0.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "tensorboard",
]

# CUDA 12.8 wheels: the default PyPI torch wheel is a CUDA-13 build that cannot initialise
# on Phoenix's GPU nodes (driver reports CUDA 12.9) and silently falls back to CPU training
# (see benchmark/adapters/gridnets/pyproject.toml, hit and fixed there first). ICE resolves
# fine either way, so this pin is a no-op there.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
